name: setup-rokit
description: GitHub action to install and run rokit; a toolchain manager for install roblox coding tools and others.
author: unknown420x

inputs:
  version:
    description: "set version of `rokit` (e.g., v1.2.0) and the latest version will be used if not specified who is 1.2.0"
    required: false
  path:
    description: "Path to the directory with the toolchain manifest. (default is '.', the current directory.)"
    default: "."
    required: false
  cache:
    description: "Whether to enable caching."
    default: "false"
    required: false
  token:
    description: "GitHub token via `github.token`, recommended for avoiding rate limits."
    default: "${{ github.token }}"
    required: false

runs:
  using: "composite"
  steps:
    - name: Add install scripts to path
      run: echo "${{ github.action_path }}" >> $GITHUB_PATH
      shell: bash

    - name: Download and install latest Rokit
      run: install.sh
      env:
        ROKIT_VERSION: ${{ inputs.version }}
        GITHUB_PAT: ${{ inputs.token }}
      shell: bash

    - name: Add Rokit to the system path
      if: runner.os != 'Windows'
      run: echo "$HOME/.rokit/bin" >> $GITHUB_PATH
      shell: bash

    - name: Add Rokit to the system path (Only for windows)
      if: runner.os == 'Windows'
      run: echo "$HOME/.rokit/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: powershell

    - name: Authenticate Rokit with github token
      if: ${{ inputs.token != '' }}
      run: rokit authenticate github --token "${{ inputs.token }}"
      shell: bash

    - name: Discover the manifest file
      id: manifest
      run: |
        manifest_path=$(find "${{ inputs.path }}" -maxdepth 1 \( -name "rokit.toml" -o -name "aftman.toml" -o -name "foreman.toml" \) | head -n 1)
        echo "::debug::Discovered manifest path: $manifest_path"
        echo "path=$manifest_path" >> $GITHUB_OUTPUT
      shell: bash

    - name: Cache toolchain binaries
      if: ${{ inputs.cache == true || inputs.cache == 'true' }}
      uses: actions/cache@v5
      with:
        path: |
          ~/.rokit/bin
          ~/.rokit/tool-storage
        key: ${{ runner.os }}-rokit-${{ hashFiles(steps.manifest.outputs.path) }}
        restore-keys: |
          ${{ runner.os }}-rokit-

    - name: Install toolchain dependencies
      run: |
        cd "${{ inputs.path }}"
        rokit install --no-trust-check
      shell: bash

branding:
  icon: download
  color: red
