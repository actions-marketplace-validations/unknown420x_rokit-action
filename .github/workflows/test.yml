name: Test Rokit Version Resolution

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
      version_label:
        type: string
        required: true
      version_check_pattern:
        type: string
        required: false

defaults:
  run:
    shell: bash

jobs:
  test-version:
    runs-on: ${{ matrix.os }}
    name: Versions - ${{ inputs.version_label }} (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Create Rokit manifest
        run: |
          cat > rokit.toml << 'EOF'
          [tools]
          selene = "Kampfkarren/selene@0.32.0"
          EOF

      - name: Run setup-rokit
        uses: ./
        with:
          version: ${{ inputs.version }}

      - name: Verify Rokit is installed
        run: rokit --version

      - name: Verify Rokit version matches pattern
        shell: bash
        run: |
          VERSION_OUTPUT=$(rokit --version)
          echo "Rokit version output: $VERSION_OUTPUT"

          PATTERN="${{ inputs.version_check_pattern }}"
          if [ -n "$PATTERN" ]; then
            # Uses grep for a better validation and compatible with other shells
            if echo "$VERSION_OUTPUT" | grep -Fq "$PATTERN"; then
              echo "SUCCESS: Version matches expected pattern '$PATTERN'"
            else
              echo "ERROR: Version output '$VERSION_OUTPUT' does not contain expected pattern '$PATTERN'"
              exit 1
            fi
          else
            echo "SUCCESS: Rokit installed (latest version)"
          fi
