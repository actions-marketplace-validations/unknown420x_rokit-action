on:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
      path:
        type: string
        default: "."
        required: false
      cache:
        type: string
        default: "true"
        required: false
      token:
        type: string
        default: ""
        required: false

defaults:
  run:
    shell: bash

jobs:
  test-env:
    runs-on: ${{ matrix.os }}
    name: Environment - ${{ matrix.manifest }} (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        manifest: [rokit.toml, aftman.toml, foreman.toml]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Create manifest file (aftman/rokit)
        if: matrix.manifest != 'foreman.toml'
        run: |
          cat > "${{ inputs.path }}/${{ matrix.manifest }}" << EOF
          [tools]
          selene = "Kampfkarren/selene@0.32.0"
          StyLua = "JohnnyMorganz/StyLua@2.6.0"
          rojo = "rojo-rbx/rojo@7.7.1"
          EOF

      - name: Create manifest file (foreman)
        if: matrix.manifest == 'foreman.toml'
        run: |
          cat > "${{ inputs.path }}/${{ matrix.manifest }}" << EOF
          [tools]
          selene = { github = "Kampfkarren/selene", version = "0.32.0" }
          StyLua = { github = "JohnnyMorganz/StyLua", version = "2.6.0" }
          rojo = { github = "rojo-rbx/rojo", version = "7.7.1" }
          EOF

      - name: Run setup-rokit
        uses: ./'
        with:
          version: ${{ inputs.version }}
          path: ${{ inputs.path }}
          cache: ${{ inputs.cache }}
          token: ${{ inputs.token }}

      - name: Verify executables in PATH on bash
        if: runner.os != 'Windows'
        run: |
          command -v selene
          command -v stylua
          command -v rojo

      - name: Verify executables in PATH on PowerShell (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-Command "selene"
          Get-Command "stylua"
          Get-Command "rojo"
        shell: pwsh
